[project]
name = "autokernel"
version = "0.6.0"
description = "Compile Python tile loops into gridless Pallas kernels for TPU v5e"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.11.2,<0.12",  # uses jax._src internals (the Pallas TPU interpreter, weak types)
    "numpy>=2.1",
]
keywords = ["jax", "pallas", "tpu", "compiler", "kernels"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
tpu = ["jax[tpu]>=0.11.2,<0.12"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autokernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "tpu: needs a TPU v5e (skipped elsewhere)",
    "cpu: simulates hardware behaviour in the interpreter (skipped on a TPU)",
]
filterwarnings = [
    "error",
    # TPU VMs without transparent hugepages (e.g. Colab): JAX warns at import; harmless for tests.
    "ignore:.*[Tt]ransparent hugepages:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "*.md"]  # Markdown code blocks keep their aligned comments

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # en dashes and similar in prose are fine
    "SIM108",  # ternaries aren't always clearer
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
"benchmarks/*" = ["E402"]
"tests/test_parse.py" = ["B007", "F841"]  # kernel functions that are parsed, never run

[tool.coverage.run]
source = ["autokernel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
